<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URGENT: Missing Person Alert</title>
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow: hidden; border-top: 10px solid #d32f2f; }
        .header { background: #d32f2f; color: white; text-align: center; padding: 20px; font-size: 24px; font-weight: bold; text-transform: uppercase; }
        .section { padding: 20px; border-bottom: 1px solid #eee; }
        .section-title { font-size: 18px; color: #d32f2f; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; }
        .profile-img, .car-img { width: 100%; max-width: 300px; height: auto; border-radius: 10px; display: block; margin: 0 auto 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .details { font-size: 16px; line-height: 1.6; }
        .highlight { font-weight: bold; color: #000; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 20px; background: #fdfdfd; }
        .btn { text-align: center; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; color: white; transition: 0.3s; cursor: pointer; border: none; width: 100%; font-size: 16px; }
        .btn-person { background: #d32f2f; }
        .btn-car { background: #555; }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }

        /* ---------- Driver view: square webview layout (?view=driver) ---------- */
        body.driver { padding: 0; }
        body.driver .container {
            max-width: 100vw;
            width: 100vw;
            height: 100vh;
            margin: 0;
            border-radius: 0;
            display: flex;
            flex-direction: column;
        }
        body.driver .header { padding: 10px; font-size: 16px; }
        body.driver .split-row {
            flex: 1;
            display: flex;
            flex-direction: row;
            min-height: 0;
        }
        body.driver .section { flex: 1; padding: 10px; border-bottom: none; display: flex; flex-direction: column; }
        body.driver .section:first-child { border-right: 1px solid #eee; }
        body.driver .section-title { font-size: 12px; margin-bottom: 8px; }
        body.driver .profile-img, body.driver .car-img {
            width: 100%;
            max-width: none;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            margin: 0 0 8px;
            border-radius: 8px;
        }
        body.driver .details { font-size: 12px; line-height: 1.4; overflow: hidden auto; }
        body.driver .details p { margin: 4px 0; }
        body.driver .btn-group { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">🚨 Urgent Alert 🚨</div>

    <div class="split-row">
        <!-- Person Section -->
        <div class="section">
            <div class="section-title">Person Details</div>
            <img id="personImg" src="" alt="Missing Person" class="profile-img">
            <div class="details">
                <p>Name: <span id="name" class="highlight">-</span></p>
                <p>Description: <span id="desc">-</span></p>
                <p>Last Seen: <span id="seen" class="highlight">-</span></p>
            </div>
        </div>

        <!-- Vehicle Section -->
        <div class="section">
            <div class="section-title">Associated Vehicle</div>
            <img id="carImg" src="" alt="AI Generated Vehicle" class="car-img">
            <div class="details">
                <p>Vehicle: <span id="carModel" class="highlight">-</span></p>
                <p>Color: <span id="carColor" class="highlight">-</span></p>
                <p>Plate: <span id="carPlate" class="highlight">-</span></p>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="btn-group">
        <button onclick="report('Person')" class="btn btn-person">Report Person</button>
        <button onclick="report('Vehicle')" class="btn btn-car">Report Vehicle</button>
    </div>
</div>

<script>
    // Square driver/webview layout: alert.html?id=102&view=driver
    const urlParams = new URLSearchParams(window.location.search);
    const isDriverView = urlParams.get('view') === 'driver';
    if (isDriverView) {
        document.body.classList.add('driver');
    }

    function report(type) {
        const subject = `URGENT: Tip for ${type}`;
        window.location.href = `mailto:${window.contactEmail}?subject=${encodeURIComponent(subject)}`;
    }

    async function loadAlert() {
        // 1. Get the alert ID from URL (e.g., alert.html?id=102)
        const alertId = urlParams.get('id');

        if (!alertId) {
            document.body.innerHTML = "<h1>Error: No Alert ID provided in URL</h1>";
            return;
        }

    try {
        const response = await fetch('https://raw.githubusercontent.com/stahuja/pcalert/refs/heads/main/alert.json');
        let data = await response.json();

        let alert;

        // Check if 'data' is an array. If it is, use .find().
        // If it's already a single object, just use it directly!
        if (Array.isArray(data)) {
            alert = data.find(item => item.alert_id === alertId);
        } else {
            // It's a single object, so we check if the ID matches
            if (data.alert_id === alertId) {
                alert = data;
            }
        }

        if (alert) {
            document.getElementById('name').innerText = alert.person_name;
            document.getElementById('desc').innerText = alert.description;
            document.getElementById('seen').innerText = alert.last_seen;
            document.getElementById('personImg').src = alert.photo_url;

            document.getElementById('carModel').innerText = alert.car_model;
            document.getElementById('carColor').innerText = alert.car_color;
            document.getElementById('carPlate').innerText = alert.car_plate;

            const aiPrompt = `A professional high-resolution automotive studio photo of a ${alert.car_color} ${alert.car_model}, side view, realistic lighting, 8k resolution, white background`;
            const imgSize = isDriverView ? 'width=600&height=600' : 'width=600&height=400';
            document.getElementById('carImg').src = `https://image.pollinations.ai/prompt/${encodeURIComponent(aiPrompt)}?${imgSize}&nologo=true`;

            window.contactEmail = alert.contact_email;
        } else {
            document.body.innerHTML = "<h1 style='text-align:center;'>Alert not found</h1>";
        }
    } catch (error) {
        console.error("Error fetching data:", error);
        document.body.innerHTML = "<h1 style='text-align:center;'>System Error loading alert</h1>";
    }
  }
    loadAlert();
</script>

</body>
</html>
